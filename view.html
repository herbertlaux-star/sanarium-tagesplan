  :root{
    --black:#000000;
    --white:#ffffff;
    --gray:#868785;
    --orange:#f4bd00;
    --cream:#efcfa9;
    --pink:#ef5b84;
    --ink: var(--black);
    --ink-soft: var(--gray);
    --line: rgba(0,0,0,0.14);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    width:100%; height:100%;
    background:#000;
    font-family:'Frutiger LightCn', sans-serif;
    overflow:hidden;
  }
  .stage{ width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
  .screen{
    width:1080px; height:1920px; flex:0 0 auto;
    display:flex; flex-direction:column;
    background:var(--cream);
    transform-origin:center center;
  }

  /* ===== HERO / AKTUELL ===== */
  .hero{
    height:1000px;
    position:relative;
    overflow:hidden;
    color:var(--white);
    padding:56px 80px 48px;
    display:flex; flex-direction:column;
    background:
      radial-gradient(ellipse 950px 550px at 88% -10%, rgba(244,189,0,0.38), transparent 60%),
      radial-gradient(ellipse 750px 650px at 100% 100%, rgba(239,91,132,0.16), transparent 65%),
      linear-gradient(160deg,#1c1c1c 0%, #0c0c0c 60%, #000000 100%);
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.05) 0, transparent 3%),
      radial-gradient(circle at 60% 70%, rgba(255,255,255,0.04) 0, transparent 4%),
      radial-gradient(circle at 80% 40%, rgba(255,255,255,0.05) 0, transparent 3%),
      radial-gradient(circle at 35% 80%, rgba(255,255,255,0.04) 0, transparent 3%);
    pointer-events:none;
  }
  .steam{
    position:absolute; right:-40px; top:-60px; width:560px; height:560px;
    background: radial-gradient(circle, rgba(255,255,255,0.09) 0%, transparent 70%);
    filter: blur(10px);
    animation: drift 9s ease-in-out infinite alternate;
  }
  @keyframes drift{
    from{ transform:translateY(0) scale(1); }

<script>
/* ============================================================
   SAUNA VIEW Screen – Daten: Blatt "Finnische Sauna" (Zeiten),
   "Einstellungen" (Aufguss-Minuten, Zeile View) und "Infrarot".
   Der Wochenplan kommt live aus der Google-Tabelle: Code.gs liefert
   ihn als reine Daten (JSON) unter DATA_URL aus, diese Seite laedt
   ihn alle 5 Minuten neu. Kein Google-Banner, weil die Seite selbst
   nicht mehr ueber Google ausgeliefert wird.
   Der letzte erfolgreich geladene Plan wird im Browser gemerkt, damit
   der Screen auch bei kurzem Internet-Ausfall weiterlaeuft.
   ============================================================ */
const DATA_URL = "https://script.google.com/macros/s/AKfycbwi6oI96_qHr6GsFBUZ0OCP2KTLpHeZ8Q3iMpwGs2W6LeKBrmrMP1vsK9nfK_aiI3YYEQ/exec?format=alle&screen=view";   // screen=… nur fuer status.html (Online-Kontrolle)
const DATA_REFRESH_MS = 5 * 60 * 1000;   // Plan alle 5 Minuten frisch aus der Tabelle holen
const RETRY_MS = 30 * 1000;              // bei Fehler nach 30 Sekunden erneut versuchen
const PAGE_RELOAD_MS = 60 * 60 * 1000;   // Seite 1x pro Stunde neu laden (holt Design-Updates)
const UI_REFRESH_MS = 30 * 1000;         // Uhrzeit/Hervorhebung alle 30 Sekunden aktualisieren
const CACHE_KEY = "sauna-view-cache";

/* format=alle liefert {sanarium, finnisch, infrarot, aufguss}.
   Fuer diesen Screen: Sauna View (= Blatt "Finnische Sauna") + Infrarot. */
function toViewData(d){
  if(!d || !d.finnisch || typeof d.finnisch !== "object") throw new Error("keine Sauna-View-Daten");
  const out = Object.assign({}, d.finnisch);
  out._aufguss = { view: (d.aufguss && Array.isArray(d.aufguss.view)) ? d.aufguss.view : [15,45] };
  out._infrarot = (d.infrarot && typeof d.infrarot === "object") ? d.infrarot : null;
  out._regeln = (d.regeln && typeof d.regeln === "object") ? d.regeln : null;
  return out;
}
function readCache(){
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    const data = raw ? JSON.parse(raw) : null;
    return (data && typeof data === "object" && Object.keys(data).length) ? data : null;
  } catch (e) { return null; }
}
function writeCache(data){
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e) {}
}

let scheduleData = readCache();

const WEEKDAY_ORDER = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const ROOM_SPECS = { "Sanarium": { temp:55, hum:50 }, "Finnisch": { temp:85, hum:10 } };
const TIMEZONE = "Europe/Vienna";

/* ---------- Icons (inline SVG) ---------- */
function personIcon(color){
  return `<svg viewBox="0 0 40 64" fill="none">
    <circle cx="20" cy="10" r="9" stroke="${color}" stroke-width="3" fill="none"/>
    <path d="M6 60 L10 28 Q20 20 30 28 L34 60" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
  </svg>`;
}
function mixedIcon(color){
  return `<svg viewBox="0 0 76 64" fill="none">
    <circle cx="18" cy="10" r="8" stroke="${color}" stroke-width="3" fill="none"/>
    <path d="M6 58 L9 26 Q18 19 27 26 L30 58" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
    <circle cx="58" cy="10" r="8" stroke="${color}" stroke-width="3" fill="none"/>
    <path d="M50 30 L46 44 L52 44 L52 58 L64 58 L64 44 L70 44 L66 30 Z" stroke="${color}" stroke-width="3" stroke-linejoin="round" fill="none"/>
  </svg>`;
}
function cleaningIcon(color){
  return `<svg viewBox="0 0 64 64" fill="none">
    <rect x="18" y="27" width="21" height="33" rx="4" stroke="${color}" stroke-width="3" fill="none"/>
    <rect x="24" y="18" width="9" height="10" stroke="${color}" stroke-width="3" fill="none"/>
    <path d="M33 21 L46 21 L46 12 L37 12" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M52 6 L58 3 M55 13 L62 13 M52 20 L58 24" stroke="${color}" stroke-width="2.6" stroke-linecap="round" opacity="0.65" fill="none"/>
  </svg>`;
}
function thermoIcon(color){
  return `<svg viewBox="0 0 24 24" fill="none">
    <path d="M12 3a2 2 0 0 0-2 2v9.17a4 4 0 1 0 4 0V5a2 2 0 0 0-2-2z" stroke="${color}" stroke-width="1.6" fill="none"/>
    <circle cx="12" cy="18" r="2.4" fill="${color}"/>
  </svg>`;
}
function dropIcon(color){
  return `<svg viewBox="0 0 24 24" fill="none">
    <path d="M12 2C12 2 5 11 5 15.5A7 7 0 0 0 19 15.5C19 11 12 2 12 2Z" stroke="${color}" stroke-width="1.6" fill="none"/>
  </svg>`;
}
function arrowIcon(color){
  return `<svg viewBox="0 0 120 80" fill="none">
    <path d="M6 40 H96" stroke="${color}" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M66 10 L100 40 L66 70" stroke="${color}" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </svg>`;
}

/* ---------- Helfer ---------- */
function toMinutes(hhmm){
  const [h,m] = hhmm.split(":").map(Number);
  return h*60+m;
}
function nowInVienna(){
  const parts = new Intl.DateTimeFormat("de-DE",{ timeZone:TIMEZONE, weekday:"long", hour:"2-digit", minute:"2-digit", hour12:false }).formatToParts(new Date());
  const map = {};
  parts.forEach(p=> map[p.type]=p.value);
  return { weekday: map.weekday, minutes: parseInt(map.hour,10)*60+parseInt(map.minute,10) };
}
function isClosedRow(r){ const b = String((r && r.bereich) || "").trim().toLowerCase(); return b.startsWith("geschl") || b.includes("geschlossen"); }
function closedReason(r){
  // "Geschl. wg. Umbau" / "Geschlossen wegen Umbau" -> "wg. Umbau" / "wegen Umbau"
  return String(r.bereich || "").trim().replace(/^geschl(ossen|\.)?\s*/i, "").trim();
}
function findActive(rows, nowMinutes){
  return rows.find(r => nowMinutes >= toMinutes(r.start) && nowMinutes < toMinutes(r.end)) || null;
}
function findNext(weekday, nowMinutes){
  let idx = WEEKDAY_ORDER.indexOf(weekday);
  let rows = scheduleData[weekday] || [];
  let upcoming = rows.find(r => toMinutes(r.start) > nowMinutes && !isClosedRow(r));
  if(upcoming) return { weekday, row:upcoming };
  for(let i=1;i<=7;i++){
    const wd = WEEKDAY_ORDER[(idx+i)%7];
    const wdRows = (scheduleData[wd] || []).filter(r => !isClosedRow(r));
    if(wdRows.length){ return { weekday: wd, row: wdRows[0] }; }
  }
  return null;
}

/* ---------- Rendering ---------- */
const WAY_COLOR = "#f4bd00";
/* Statuszeile verkleinern, falls sie nicht in die Breite passt (nie abschneiden) */
function fitLabel(el){
  el.style.fontSize = "";
  requestAnimationFrame(function(){
    const box = el.parentElement;
    let size = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth && size > 56){ size -= 2; el.style.fontSize = size + "px"; }
  });
}
function afterText(){ return ""; }
function dayLabel(wd){
  const today = nowInVienna().weekday;
  if(wd === today) return "heute";
  const i = WEEKDAY_ORDER.indexOf(today);
  if(WEEKDAY_ORDER[(i+1)%7] === wd) return "morgen";
  return wd;
}
function findNextAfter(row){
  const { weekday } = nowInVienna();
  return findNext(weekday, toMinutes(row.end) - 1);
}
function closedIcon(color){
  return `<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="24" stroke="${color}" stroke-width="3"/><path d="M15 49 L49 15" stroke="${color}" stroke-width="3" stroke-linecap="round"/></svg>`;
}
function renderHero(activeRow, nextInfo, rows){
  const labelEl = document.getElementById("statusLabel");
  const metricsEl = document.getElementById("statusMetrics");
  const timeEl = document.getElementById("statusTime");
  const accessEl = document.getElementById("statusAccess");
  const iconEl = document.getElementById("statusIcon");
  iconEl.classList.remove("pulse");

  if(!activeRow){
    labelEl.className = "status-label mixed compact";
    labelEl.innerHTML = "GESCHLOSSEN";
    fitLabel(labelEl);
    metricsEl.innerHTML = "";
    iconEl.innerHTML = closedIcon("#ffffff");
    if(nextInfo){
      timeEl.textContent = "";
      accessEl.textContent = "Nächste Einheit: " + dayLabel(nextInfo.weekday) + " " + nextInfo.row.start + " Uhr";
    } else {
      accessEl.textContent = "";
    }
    return;
  }

  if(isClosedRow(activeRow)){
    labelEl.className = "status-label mixed compact";
    labelEl.innerHTML = "GESCHLOSSEN";
    fitLabel(labelEl);
    metricsEl.innerHTML = "";
    iconEl.innerHTML = closedIcon("#ffffff");
    timeEl.textContent = activeRow.start + " – " + activeRow.end;
    const nx = findNextAfter(activeRow);
    const esc2 = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    accessEl.innerHTML = [closedReason(activeRow), nx ? "Wieder offen: " + dayLabel(nx.weekday) + " " + nx.row.start + " Uhr" : ""].filter(Boolean).map(esc2).join("<br>");
    return;
  }
  const activeBereichNorm = String(activeRow.bereich || "").trim().toLowerCase();
  if(activeBereichNorm.includes("reinigung")){
    labelEl.className = "status-label mixed compact";
    labelEl.innerHTML = "REINIGUNG";
    fitLabel(labelEl);
    metricsEl.innerHTML = "";
    iconEl.innerHTML = cleaningIcon("#ffffff");
    timeEl.textContent = activeRow.start + " – " + activeRow.end;
    accessEl.textContent = afterText(activeRow, rows);
    return;
  }

  const [mode, ...roomParts] = activeRow.bereich.split(" ");
  const room = roomParts.join(" ");
  const isLadies = mode.trim().toLowerCase() === "ladies";
  const specs = ROOM_SPECS[room] || { temp:"-", hum:"-" };
  const accent = isLadies ? "#ef5b84" : "#ffffff";

  labelEl.className = "status-label" + (isLadies ? "" : " mixed");
  fitLabel(labelEl);
  labelEl.innerHTML = mode.toUpperCase() + "<br>" + room.toUpperCase();
  iconEl.innerHTML = isLadies ? personIcon(accent) : mixedIcon(accent);
  if(isLadies) iconEl.classList.add("pulse");
  metricsEl.innerHTML =
    `<span>${thermoIcon("#ffffff")} ${specs.temp} &deg;C</span>` +
    `<span>${dropIcon("#ffffff")} ${specs.hum} %</span>`;
  timeEl.textContent = activeRow.start + " – " + activeRow.end;
  accessEl.textContent = afterText(activeRow, rows);
}


/* ---------- Aufguss: Minuten aus dem Blatt Einstellungen (Zeile View), nur bei Betrieb ---------- */
function steamIcon(c){
  return `<svg viewBox="0 0 24 24" fill="none"><path d="M7 21c-2-3 2-5 0-8s2-5 0-8" stroke="${c}" stroke-width="1.8" stroke-linecap="round"/><path d="M12 21c-2-3 2-5 0-8s2-5 0-8" stroke="${c}" stroke-width="1.8" stroke-linecap="round"/><path d="M17 21c-2-3 2-5 0-8s2-5 0-8" stroke="${c}" stroke-width="1.8" stroke-linecap="round"/></svg>`;
}
function hhmm(m){ return String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
function isAufgussAt(rows, m){
  // Aufguss nur im Modus Finnisch (im Sanarium gibt es Bedampfung statt Aufguss)
  return rows.some(r => {
    const b = String(r.bereich).toLowerCase();
    return b.includes("finnisch") && m >= toMinutes(r.start) && m < toMinutes(r.end);
  });
}
function aufgussMinutes(){
  const a = scheduleData && scheduleData._aufguss && scheduleData._aufguss.view;
  return Array.isArray(a) ? a : [15, 45];   // Standard Sauna View: Viertel nach / Viertel vor
}

const AUF_DIR = "l";   // Pfeilrichtung zur Sauna
function renderAufguss(rows, nowMin, activeRow){
  // Aufguss im blinkenden Pfeil mit Countdown-Ring (wird jede Minute lokal neu berechnet)
  const el = document.getElementById("aufguss");
  let st = null, diff = 0, time = "";
  if(activeRow && !isClosedRow(activeRow) && String(activeRow.bereich).toLowerCase().includes("sanarium")) st = "bed";
  else {
    const mins = aufgussMinutes();
    for(let k = 0; k < AUF_NOW_MIN && !st; k++){ const m = nowMin - k; if(m >= 0 && mins.includes(m % 60) && isAufgussAt(rows, m)) st = "now"; }
    // naechster Aufguss nur innerhalb der laufenden Einheit (nicht erst in einer spaeteren)
    const limit = (activeRow && !isClosedRow(activeRow)) ? toMinutes(activeRow.end) : 0;
    if(!st){ for(let c = nowMin + 1; c < limit; c++){ if(mins.includes(c % 60) && isAufgussAt(rows, c)){ st = "count"; diff = c - nowMin; time = hhmm(c); break; } } }
  }
  let nextRow = null;
  if(!st){
    // kein Aufguss mehr: Countdown bis die Sauna schliesst (oder bis zum naechsten Betrieb)
    if(!activeRow || isClosedRow(activeRow)){ el.dataset.h = ""; el.innerHTML = ""; return; }
    nextRow = rows.find(r => r.start === activeRow.end && !isClosedRow(r) && !String(r.bereich).toLowerCase().includes("reinigung")) || null;
    diff = Math.max(0, toMinutes(activeRow.end) - nowMin);
    time = activeRow.end;
    st = nextRow ? "change" : "close";
  }
  const ring = (p, inner) => { const C = 2 * Math.PI * 80;
    return `<div class="ring"><svg viewBox="0 0 186 186"><circle cx="93" cy="93" r="80" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="14"/>` +
      `<circle cx="93" cy="93" r="80" fill="none" stroke="#000" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/></svg><div class="num">${inner}</div></div>`; };
  let h;
  if(st === "count") h = ring(Math.max(0, Math.min(1, 1 - diff/30)), `<b>${diff}</b><span>MIN</span>`) + `<div class="col"><div class="l1">Nächster Aufguss</div><div class="l2">${time} Uhr</div></div>`;
  else if(st === "now") h = ring(1, `<img class="aico" src="${AUF_ICON_KELLE}" alt="">`) + `<div class="col"><div class="l1">Aufguss</div><div class="l2">JETZT</div></div>`;
  else if(st === "bed") h = `<div class="ring stm">${steamIcon("#000")}</div><div class="col"><div class="l1">Automatische</div><div class="l2">Bedampfung</div></div>`;
  else {
    const num = `<b${diff > 99 ? ' class="d3"' : ''}>${diff}</b><span>MIN</span>`;
    const p = Math.max(0, Math.min(1, 1 - diff/30));
    h = st === "close"
      ? ring(p, num) + `<div class="col"><div class="l1">Sauna schließt</div><div class="l2">${time} Uhr</div></div>`
      : ring(p, num) + `<div class="col"><div class="l1">Ab ${time} Uhr</div><div class="l2">${nextRow.bereich}</div></div>`;
  }
  const alert = st === "now" || (st === "count" && diff <= 2);   // kurz vor/waehrend Aufguss blinken, sonst ruhig fliessen
  const html = `<div class="pf ${AUF_DIR}${st === "now" ? " now" : ""}${alert ? " alert" : ""}">${h}</div>`;
  if(el.dataset.h === html) return;                 // unveraendert -> Blinken laeuft ruhig weiter
  el.dataset.h = html; el.innerHTML = html;
  // Text nie abschneiden: grosse Zeile verkleinern, bis alles im Pfeil Platz hat
  const pf = el.firstChild, big = pf.querySelector(".l2");
  if(big){ const col = big.parentElement; let fs = parseFloat(getComputedStyle(big).fontSize);
    while(big.scrollWidth > col.clientWidth + 1 && fs > 56){ fs -= 4; big.style.fontSize = fs + "px"; } }
}

/* update() darf nie den Rest der Seite stoppen: Fehler werden gemerkt und an status.html gemeldet */
let lastErr = "", dataOk = false, lastDataOk = 0;
function update(){ try{ updateInner(); }catch(e){ lastErr = "Anzeige: " + (e && e.message ? e.message : e); console.warn(e); } }
window.addEventListener("error", function(ev){ lastErr = "JS: " + (ev && ev.message ? ev.message : "Fehler"); });
function updateInner(){
  const { weekday, minutes } = nowInVienna();
  const rows = scheduleData[weekday] || [];
  const active = findActive(rows, minutes);
  const next = active ? null : findNext(weekday, minutes);
  renderWeek(weekday);
  renderInfra(weekday, minutes);
  renderAufInfo();
  renderHero(active, next, rows);
  renderAufguss(rows, minutes, active);
}

/* ---------- Daten laden ---------- */
let dataTimer = null;
function loadData(){
  clearTimeout(dataTimer);
  fetch(DATA_URL, { cache: "no-store" })
    .then(function(res){ if(!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
    .then(function(data){
      if(!data || typeof data !== "object" || !Object.keys(data).length) throw new Error("leere Daten");
      data = toViewData(data);
      scheduleData = data;
      dataOk = true; lastDataOk = Date.now();
      writeCache(data);
      update();
      dataTimer = setTimeout(loadData, DATA_REFRESH_MS);
    })
    .catch(function(err){
      console.warn("Tagesplan konnte nicht geladen werden:", err);
      dataOk = false; lastErr = "Daten: " + (err && err.message ? err.message : err);
      // Letzter bekannter Plan bleibt stehen, nur neu versuchen.
      dataTimer = setTimeout(loadData, RETRY_MS);
    });
}

function tick(){
  if(scheduleData) update();
}

// Stuendlicher Reload nur, wenn die Seite gerade erreichbar ist -
// sonst wuerde der Screen bei Internet-Ausfall eine Fehlerseite zeigen.
function safeReload(){
  fetch(location.href, { cache: "no-store", method: "HEAD" })
    .then(function(res){ if(res.ok) location.reload(); else setTimeout(safeReload, RETRY_MS); })
    .catch(function(){ setTimeout(safeReload, RETRY_MS); });
}

  const p = new Intl.DateTimeFormat("de-AT",{ timeZone:TIMEZONE, hour:"2-digit", minute:"2-digit", hour12:false }).formatToParts(new Date());
  const h = (p.find(x=>x.type==="hour")||{}).value, m = (p.find(x=>x.type==="minute")||{}).value;
  const el = document.getElementById("clock");
  const txt = h + ":" + m;
  if(el.dataset.t !== txt){ const first = !el.dataset.t; el.dataset.t = txt; el.innerHTML = h + '<span class="sep">:</span>' + m; if(!first && typeof scheduleData!=="undefined" && scheduleData) update(); }
}

/* ================= Sauna View: Infokästen + Infrarot ================= */
const DAY_SHORT = { Montag:"MO", Dienstag:"DI", Mittwoch:"MI", Donnerstag:"DO", Freitag:"FR", Samstag:"SA", Sonntag:"SO" };
const WEEK_MO = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
function isCleanRow(r){ return String((r && r.bereich) || "").toLowerCase().includes("reinigung"); }
/* Oeffnungszeit eines Tages (Reinigung/Geschlossen ausgenommen, angrenzende Slots zusammengefasst) */
function dayHours(plan, wd){
  const rows = ((plan && plan[wd]) || []).filter(r => !isClosedRow(r) && !isCleanRow(r));
  if(!rows.length) return "geschlossen";
  // sortieren und ueberlappende/aneinandergrenzende Zeiten zusammenfassen (doppelte Zeilen im Sheet stoeren nicht)
  const parts = [];
  rows.slice().sort((a,b) => toMinutes(a.start) - toMinutes(b.start)).forEach(r => {
    const l = parts[parts.length-1];
    if(l && toMinutes(r.start) <= toMinutes(l.end)){ if(toMinutes(r.end) > toMinutes(l.end)) l.end = r.end; }
    else parts.push({ start:r.start, end:r.end });
  });
  return parts.map(p => p.start + " – " + p.end).join(" · ");
}
/* gleiche, aufeinanderfolgende Tage zusammenfassen */
function weekGroups(plan){
  const groups = [];
  WEEK_MO.forEach(wd => {
    const h = dayHours(plan, wd), g = groups[groups.length-1];
    if(g && g.h === h){ g.to = wd; g.days.push(wd); } else groups.push({ from:wd, to:wd, h:h, days:[wd] });
  });
  return groups;
}
function groupLabel(g){
  if(g.days.length === 7) return "TÄGLICH";
  return g.from === g.to ? DAY_SHORT[g.from] : DAY_SHORT[g.from] + " – " + DAY_SHORT[g.to];
}
function renderWeek(today){
  const groups = weekGroups(scheduleData);
  const el = document.getElementById("week");
  el.style.fontSize = groups.length > 2 ? (groups.length > 3 ? "30px" : "36px") : "";
  el.innerHTML = groups.map(g => {
    const cls = (g.days.length < 7 && g.days.includes(today)) ? "today" : "";
    return `<span class="d ${cls}">${groupLabel(g)}</span><span class="${cls}">${g.h}</span>`;
  }).join("");
}
function renderAufInfo(){
  const mins = aufgussMinutes().slice().sort((a,b)=>a-b);
  document.getElementById("aufHead").innerHTML = steamIcon("#f4bd00") + "AUFGUSS";
  const el = document.getElementById("aufInfo");
  if(!mins.length){ el.innerHTML = "derzeit kein Aufguss"; return; }
  let every = mins.length + "× pro Stunde";
  if(mins.length === 1) every = "stündlich";
  if(mins.length === 2 && mins[1] - mins[0] === 30) every = "alle 30 Min";
  if(mins.length === 4 && mins.every((m,i) => i === 0 || m - mins[i-1] === 15)) every = "alle 15 Min";
  el.innerHTML = every + "<small>jeweils um " + mins.map(m => ":" + String(m).padStart(2,"0")).join(" und ") + "</small>";
}

/* Infrarotkabine: Zeiten aus dem Blatt "Infrarot".
   Fehlt das Blatt (oder ist es leer), gelten diese Standardzeiten: */
const INFRA_DEFAULT = (function(){
  const p = {};
  ["Montag","Dienstag","Mittwoch","Donnerstag"].forEach(d => p[d] = [{ start:"06:00", end:"24:00", bereich:"Infrarot" }]);
  ["Freitag","Samstag","Sonntag"].forEach(d => p[d] = [{ start:"06:00", end:"23:00", bereich:"Infrarot" }]);
  return p;
})();
function infraPlan(){
  const p = scheduleData && scheduleData._infrarot;
  return (p && Object.keys(p).length) ? p : INFRA_DEFAULT;
}
function renderInfra(weekday, nowMin){
  const plan = infraPlan();
  const rows = plan[weekday] || [];
  const active = findActive(rows, nowMin);
  const stateEl = document.getElementById("irState");
  const noteEl = document.getElementById("irNote");
  const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  if(active && !isClosedRow(active) && !isCleanRow(active)){
    stateEl.innerHTML = `<div class="ir-state open"><i></i>GEÖFFNET</div>`;
    noteEl.innerHTML = "";
  } else {
    stateEl.innerHTML = `<div class="ir-state closed">GESCHLOSSEN</div>`;
    if(active && isClosedRow(active)){
      // Defekt / Wartung: Grund und Zeitraum anzeigen
      const why = closedReason(active);
      const span = (active.start <= "06:00" && toMinutes(active.end) >= 22*60) ? "Heute geschlossen" : ("Geschlossen bis " + active.end + " Uhr");
      noteEl.innerHTML = closedIcon("#000") + esc(span + (why ? " – " + why : ""));
    } else if(active && isCleanRow(active)){
      noteEl.innerHTML = cleaningIcon("#000") + esc("Reinigung bis " + active.end + " Uhr");
    } else {
      noteEl.innerHTML = "";
    }
  }
  const groups = weekGroups(plan);
  const hoursEl = document.getElementById("irHours");
  hoursEl.className = "ir-hours" + (groups.length === 1 ? " one" : "") + (groups.length > 2 ? " many" : "");
  hoursEl.innerHTML = groups.map(g => {
    const today = g.days.includes(weekday) && g.days.length < 7;
    const off = g.h === "geschlossen";
    return `<div class="irh${today ? " today" : ""}${off ? " off" : ""}"><span class="d">${groupLabel(g)}</span><span class="t">${off ? "geschlossen" : g.h}</span></div>`;
  }).join("");
}
if(scheduleData) update();

/* ================= Lebenszeichen fuer status.html =================
   Alle 5 Minuten ein kleines Signal an das Apps Script (als Bild-Anfrage,
   funktioniert auch, wenn das Laden der Daten einmal scheitert). */
function ping(){
  try{
    const base = DATA_URL.split("?")[0];
    const fresh = dataOk && Date.now() - lastDataOk < 15 * 60 * 1000;
    const q = "?format=ping&screen=view&data=" + (fresh ? "ok" : "alt") + "&regeln=" + rulePhase +
              (lastErr ? "&err=" + encodeURIComponent(String(lastErr).slice(0, 80)) : "") + "&t=" + Date.now();
    const img = new Image(); img.src = base + q;
  }catch(e){}
}
setTimeout(ping, 20000);
setInterval(ping, 5 * 60 * 1000);

const RULE_TEXT = {
  de: { tb:"REGELN", r:["Großes Handtuch","Textilfreie Sauna","Ruhebereich","Handy bleibt im Spind","Vorher duschen","Ladies = nur Damen"] },
  en: { tb:"RULES",  r:["Large towel","Textile-free sauna","Quiet zone","Phone stays in locker","Shower first","Ladies = women only"] }
};
function ruleTiming(){
  const r = (scheduleData && scheduleData._regeln) || {};
  const n = (v, d) => (typeof v === "number" && isFinite(v) && v >= 0) ? v : d;
  return { info: Math.max(5, n(r.info, 40)), de: n(r.de, 10), en: n(r.en, 10) };
}
function placeRules(){
  // Regeln decken genau den unteren Bereich ab (Infokaesten + Infrarot), nie den Status
  const sc = document.querySelector(".screen").getBoundingClientRect();
  const k = sc.height / 1920;                                   // Bildschirm-Skalierung
  const ib = document.querySelector(".infoband").getBoundingClientRect();
  const st = document.querySelector(".status-row").getBoundingClientRect();
  let top = Math.min((ib.top - sc.top) / k - 110, 1310);
  top = Math.max(top, (st.bottom - sc.top) / k + 24);
  document.getElementById("rules").style.top = Math.round(top) + "px";
}
function fillRules(lang){
  const L = RULE_TEXT[lang];
  document.getElementById("rpTb").textContent = L.tb;
  document.getElementById("lDE").className = lang === "de" ? "on" : "";
  document.getElementById("lEN").className = lang === "en" ? "on" : "";
  document.getElementById("rgrid").innerHTML = L.r.map((t,i) =>
    `<div class="rt${i === 5 ? " lad" : ""}"><div class="ic">${RULE_ICONS[i]}</div><div class="h">${t}</div></div>`).join("");
}
function runBar(ms, from, to){
  const f = document.getElementById("rbarFill");
  f.style.transition = "none"; f.style.width = from + "%";
  void f.offsetWidth;                                           // Neustart der Animation
  f.style.transition = "width " + ms + "ms linear"; f.style.width = to + "%";
}
let rulePhase = "info", ruleTimer = null, lastPhaseChange = Date.now();
function nextRulePhase(){ try{ nextRulePhaseInner(); }catch(e){ lastErr = "Regeln: " + (e && e.message ? e.message : e); clearTimeout(ruleTimer); ruleTimer = setTimeout(nextRulePhase, 10000); } }
function nextRulePhaseInner(){
  clearTimeout(ruleTimer);
  lastPhaseChange = Date.now();
  const t = ruleTiming(), panel = document.getElementById("rules"), grid = document.getElementById("rgrid");
  const total = (t.de + t.en) * 1000;
  if(total <= 0){ panel.classList.remove("on"); rulePhase = "info"; ruleTimer = setTimeout(nextRulePhase, 60000); return; }
  if(rulePhase === "info"){
    const lang = t.de > 0 ? "de" : "en";
    placeRules(); fillRules(lang); panel.classList.add("on");
    runBar(lang === "de" ? t.de * 1000 : t.en * 1000, 0, lang === "de" && t.en > 0 ? (t.de * 1000 / total) * 100 : 100);
    rulePhase = lang;
    ruleTimer = setTimeout(nextRulePhase, (lang === "de" ? t.de : t.en) * 1000);
  } else if(rulePhase === "de" && t.en > 0){
    grid.classList.add("fade");
    setTimeout(() => { fillRules("en"); grid.classList.remove("fade"); }, 350);
    runBar(t.en * 1000, (t.de * 1000 / total) * 100, 100);
    rulePhase = "en";
    ruleTimer = setTimeout(nextRulePhase, t.en * 1000);
  } else {
    panel.classList.remove("on");
    rulePhase = "info";
    ruleTimer = setTimeout(nextRulePhase, t.info * 1000);
  }
}
// Waechter: bleibt der Wechsel haengen, wird er neu gestartet
setInterval(function(){
  const t = ruleTiming(), cycle = (t.info + t.de + t.en + 20) * 1000;
  if(Date.now() - lastPhaseChange > cycle){ rulePhase = "info"; nextRulePhase(); }
}, 10000);
// Start: kurz warten, bis die Daten (und damit der Takt aus dem Sheet) da sind
ruleTimer = setTimeout(() => { ruleTimer = setTimeout(nextRulePhase, Math.max(1000, ruleTiming().info * 1000 - 3000)); }, 3000);
